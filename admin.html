<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة دليل سلمية</title><style>body{font-family:Arial;background:#090909;color:#222;margin:0}.app{max-width:1050px;margin:20px auto;background:#fff;padding:20px;border-radius:22px}section{border:1px solid #ddd;padding:18px;border-radius:18px;margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}input,textarea,select{width:100%;padding:11px;box-sizing:border-box;margin:5px 0 10px;border:1px solid #ddd;border-radius:10px}button,a{background:#e21b23;color:#fff;border:0;border-radius:11px;padding:11px 15px;font-weight:bold;cursor:pointer;text-decoration:none;display:inline-block}.dark{background:#111}.green{background:#16834b}.danger{background:#991622}.themes{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.theme{padding:20px;border-radius:15px;color:white;text-align:center;border:3px solid transparent}.active{border-color:#000}.row{border:1px solid #ddd;padding:12px;border-radius:13px;margin:8px 0}.gate{position:fixed;inset:0;background:#090909;display:flex;align-items:center;justify-content:center;z-index:9}.login{background:#fff;padding:25px;border-radius:20px;width:min(380px,90%);text-align:center}@media(max-width:700px){.grid{grid-template-columns:1fr}.themes{grid-template-columns:1fr 1fr}.app{margin:0;border-radius:0;min-height:100vh}}</style><div id="gate" class="gate"><div class="login"><h2>🔐 إدارة دليل سلمية</h2><input id="pin" type="password" placeholder="رمز الدخول"><button onclick="unlock()" style="width:100%">دخول</button><p id="msg"></p></div></div><main id="app" class="app" style="display:none"><h1>⚙️ لوحة إدارة دليل سلمية</h1><p>الثيمات وشكل الموقع وصفحة المحل قابلين للتغيير كل فترة.</p><p id="status">☁️ جارٍ الاتصال...</p><section><h2>🎨 الثيمات</h2><div id="themes" class="themes"></div></section><section><h2>🏠 الواجهة الرئيسية</h2><div class="grid"><label>العنوان<input id="title"></label><label>الجملة<input id="subtitle"></label><label>النص الصغير<input id="tag"></label><label>واتساب إضافة المحلات<input id="wa"></label><label>اللون الرئيسي<input id="primary" type="color"></label><label>الخلفية<input id="bg" type="color"></label></div><button class="green" onclick="saveSettings()">💾 حفظ</button></section><section><h2>🔄 طريقة العرض</h2><div class="grid"><label>شكل المحلات<select id="shopStyle"><option value="card">بطاقات</option><option value="compact">بطاقات صغيرة</option><option value="list">قائمة</option></select></label><label>شكل صفحة المحل<select id="detailStyle"><option value="hero">غلاف كبير</option><option value="classic">كلاسيكي</option><option value="compact">مضغوط</option></select></label><label>عدد المحلات<input id="limit" type="number" min="1" max="100"></label></div><button class="green" onclick="saveSettings()">💾 حفظ</button></section><section><h2>🏪 إضافة محل</h2><div class="grid"><input id="name" placeholder="اسم المحل"><input id="cat" placeholder="القسم"><input id="phone" placeholder="الهاتف"><input id="whatsapp" placeholder="واتساب"><input id="address" placeholder="العنوان"><input id="maps" placeholder="رابط الخريطة"><textarea id="desc" placeholder="الوصف"></textarea><input id="slogan" placeholder="عبارة المحل"><input id="services" placeholder="الخدمات بفواصل"><input id="offers" placeholder="العروض بفواصل"><input id="logo" placeholder="رابط الشعار"><input id="cover" placeholder="رابط الغلاف"></div><button class="green" onclick="saveShop()">💾 حفظ المحل</button><button class="dark" onclick="clearForm()">تفريغ</button><div id="shopList"></div></section><a href="index.html" class="dark">فتح الموقع</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=supabase.createClient('https://fwusmydbkxuxdhocwsxk.supabase.co','sb_publishable_O53L9s6fbvwn_BZ8DEVKCA_e7C9kgoF'),K={shops:'salamiyah_shops',settings:'salamiyah_site_settings'},defaults={primary:'#e21b23',bg:'#090909',heroTitle:'دليل سلمية',heroSubtitle:'كل المحلات والخدمات في مكان واحد',heroSubtag:'تسوّق • تواصل • ادعم محلك المحلي',whatsapp:'963932629639',shopStyle:'card',detailStyle:'hero',shopLimit:20};const presets=[['الأحمر والأسود','#e21b23','#090909','#171717'],['أسود وذهبي','#d39a18','#080808','#171717'],['أحمر فاخر','#b90f18','#170204','#24080a'],['أحمر فاتح','#ef3340','#f5f5f5','#fff']];function get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}}function set(k,v){localStorage.setItem(k,JSON.stringify(v))}function s(){return {...defaults,...get(K.settings,{})}}async function cloud(id,v){set(id,v);let r=await sb.from('salamiyah_data').upsert({id,value:v,updated_at:new Date().toISOString()},{onConflict:'id'});return !r.error}async function sync(){try{let r=await sb.from('salamiyah_data').select('id,value').in('id',Object.values(K));if(r.error)throw r.error;(r.data||[]).forEach(x=>set(x.id,x.value));status.textContent='☁️ متصل بـ Supabase'}catch(e){status.textContent='⚠️ السحابة غير متاحة حالياً، الحفظ المحلي يعمل'}}function unlock(){if(pin.value.trim()==='1234'){sessionStorage.setItem('admin','1');gate.style.display='none';app.style.display='block';init()}else msg.textContent='الرمز غير صحيح'}pin.addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});if(sessionStorage.getItem('admin')==='1'){gate.style.display='none';app.style.display='block';init()}function init(){render();renderShops();sync().then(()=>{render();renderShops()})}function render(){let x=s();title.value=x.heroTitle;subtitle.value=x.heroSubtitle;tag.value=x.heroSubtag;wa.value=x.whatsapp;primary.value=x.primary;bg.value=x.bg;shopStyle.value=x.shopStyle;detailStyle.value=x.detailStyle;limit.value=x.shopLimit;themes.innerHTML=presets.map((p,i)=>`<div class="theme ${x.primary===p[1]?'active':''}" style="background:${p[2]};border-color:${p[1]}" onclick="themeSet(${i})"><b>${p[0]}</b></div>`).join('')}async function themeSet(i){let x=s(),p=presets[i];x.primary=p[1];x.bg=p[2];x.card=p[3];await cloud(K.settings,x);render()}async function saveSettings(){let x=s();Object.assign(x,{heroTitle:title.value.trim()||defaults.heroTitle,heroSubtitle:subtitle.value.trim()||defaults.heroSubtitle,heroSubtag:tag.value.trim()||defaults.heroSubtag,whatsapp:wa.value.trim(),primary:primary.value,bg:bg.value,shopStyle:shopStyle.value,detailStyle:detailStyle.value,shopLimit:Number(limit.value)||20});alert(await cloud(K.settings,x)?'تم الحفظ':'تم الحفظ محلياً فقط');render()}function arr(v){return v.split(',').map(x=>x.trim()).filter(Boolean)}function val(id){return document.getElementById(id).value.trim()}async function saveShop(){if(!val('name'))return alert('اكتب اسم المحل');let a=get(K.shops,[]);a.push({id:Date.now(),name:val('name'),cat:val('cat')||'أخرى',phone:val('phone'),whatsapp:val('whatsapp'),address:val('address'),maps:val('maps'),desc:val('desc'),slogan:val('slogan'),services:arr(val('services')),offers:arr(val('offers')),logo:val('logo'),cover:val('cover'),createdAt:Date.now()});alert(await cloud(K.shops,a)?'تم حفظ المحل':'تم الحفظ محلياً فقط');clearForm();renderShops()}function clearForm(){['name','cat','phone','whatsapp','address','maps','desc','slogan','services','offers','logo','cover'].forEach(id=>document.getElementById(id).value='')}function renderShops(){let a=get(K.shops,[]);shopList.innerHTML=a.map(x=>`<div class="row"><b>${x.name}</b> — ${x.cat}<br><small>${x.phone||''} ${x.address||''}</small><br><a href="shop.html?id=${x.id}" class="dark">صفحة المحل</a></div>`).join('')||'<p>لا يوجد محلات.</p>'}
</script></html>
