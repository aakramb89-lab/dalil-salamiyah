<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>إدارة دليل سلمية</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#f3f7fb;color:#123}button,input{font:inherit}.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#07345c,#0b4f83)}.box{width:min(430px,100%);background:#fff;border-radius:24px;padding:28px;box-shadow:0 20px 60px #0004;text-align:center}.logo{width:72px;height:72px;border-radius:20px;margin:0 auto 14px;background:#ffbd16;color:#07345c;display:grid;place-items:center;font-size:38px;font-weight:900}.box h1{margin:8px 0;color:#07345c}.box p{color:#718096;margin:0 0 20px}.pin{width:100%;padding:15px;border:2px solid #e1e9f1;border-radius:14px;text-align:center;outline:none;font-size:22px;letter-spacing:5px}.pin:focus{border-color:#087eea}.login{width:100%;margin-top:12px;padding:15px;border:0;border-radius:14px;background:#087eea;color:#fff;font-weight:800;cursor:pointer}.hint{font-size:13px;margin-top:12px;color:#8795a5}.app{display:none;padding:25px}.head{background:#fff;border-radius:20px;padding:22px;box-shadow:0 5px 20px #1231;display:flex;justify-content:space-between;align-items:center;gap:15px}.logout{border:0;border-radius:12px;padding:11px 16px;background:#e84c4c;color:#fff;font-weight:700}.card{margin-top:18px;background:#fff;border-radius:20px;padding:22px;box-shadow:0 5px 20px #1231}.ok{color:#119b59;font-weight:800}
</style>
</head>
<body>
<div id="adminGate" class="gate">
 <div class="box">
  <div class="logo">د</div>
  <h1>إدارة دليل سلمية</h1>
  <p>أدخل رمز الإدارة للدخول</p>
  <input id="adminPin" class="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="20" placeholder="رمز الإدارة">
  <button id="loginBtn" class="login" type="button">دخول الإدارة</button>
  <div class="hint">رمز الإدارة: 1234</div>
 </div>
</div>
<div id="adminApp" class="app">
 <div class="head"><div><h1>لوحة إدارة دليل سلمية</h1><div class="ok">تم تسجيل الدخول بنجاح</div></div><button class="logout" id="logoutBtn">تسجيل الخروج</button></div>
 <div class="card"><h2>مرحباً بك 👋</h2><p>هذه نسخة جاهزة لاختبار دخول لوحة الإدارة. بعد رفع الملف إلى GitHub استعمل الرابط المباشر لصفحة admin.html.</p></div>
</div>
<script>
(function(){
 const gate=document.getElementById('adminGate'), app=document.getElementById('adminApp'), pin=document.getElementById('adminPin');
 function normalize(v){return String(v||'').trim().replace(/[٠-٩]/g,function(d){return String(d.charCodeAt(0)-1632)}).replace(/[۰-۹]/g,function(d){return String(d.charCodeAt(0)-1776)});}
 function unlock(){if(normalize(pin.value)==='1234'){gate.style.display='none';app.style.display='block';sessionStorage.setItem('salamiyah_admin','1');}else{alert('رمز الإدارة غير صحيح. الرمز هو 1234');pin.value='';pin.focus();}}
 document.getElementById('loginBtn').addEventListener('click',unlock); pin.addEventListener('keydown',e=>{if(e.key==='Enter')unlock();});
 document.getElementById('logoutBtn').addEventListener('click',()=>{sessionStorage.removeItem('salamiyah_admin');location.reload();});
 if(sessionStorage.getItem('salamiyah_admin')==='1'){gate.style.display='none';app.style.display='block';}
})();
</script>
</body></html>
