<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07345c"><link rel="icon" href="favicon.svg"><title>صفحة المحل | دليل سلمية</title><style>
*{box-sizing:border-box}body{margin:0;background:#031a30;font-family:Tajawal,Arial;color:#173d61}.top{height:74px;background:#031a30;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 6%;position:sticky;top:0;z-index:10}.brand{font-weight:900;font-size:25px}.brand b{color:#ffbd16}.btn{background:#ffbd16;color:#123958;padding:10px 17px;border-radius:22px;font-weight:900;border:0}.page{max-width:1100px;margin:24px auto;background:#fff;border-radius:25px;overflow:hidden;box-shadow:0 20px 70px #0008}.cover{height:330px;background:linear-gradient(135deg,#124c74,#8eb5cf);position:relative}.cover img{width:100%;height:100%;object-fit:cover}.shade{position:absolute;inset:0;background:linear-gradient(180deg,transparent 38%,#001c38dd)}.coverText{position:absolute;z-index:2;right:35px;bottom:30px;color:#fff}.coverText .mini{font-size:13px;opacity:.9}.coverText h2{font-size:30px;margin:6px 0}.profile{position:relative;padding:0 35px 28px}.logo{width:120px;height:120px;border-radius:50%;background:#fff;border:7px solid #fff;box-shadow:0 8px 30px #0003;position:relative;margin-top:-60px;display:grid;place-items:center;font-size:40px;color:#07345c;overflow:hidden}.logo img{width:100%;height:100%;object-fit:cover}.name{font-size:30px;margin:10px 0 5px}.badge{display:inline-block;background:#e6f8ef;color:#098152;border-radius:20px;padding:6px 12px;font-size:12px}.meta{color:#7890a5}.slogan{font-weight:900;color:#07345c;margin:10px 0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.actions a,.actions button{padding:12px 20px;border-radius:13px;background:#087eea;color:#fff;font-weight:900;border:0;cursor:pointer}.actions .wa{background:#13bb68}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:18px;padding:0 35px 35px}.box{border:1px solid #e2eaf1;border-radius:18px;padding:18px}.box h2{margin-top:0;color:#07345c}.services{display:flex;flex-wrap:wrap;gap:8px}.pill{background:#edf6ff;border-radius:18px;padding:8px 12px;font-size:12px}.offer{background:#fff7d8;border:1px solid #ffd56b;border-radius:15px;padding:12px;margin-top:8px}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.gallery img{width:100%;height:130px;object-fit:cover;border-radius:12px}.placeholder{height:130px;background:linear-gradient(135deg,#d8ebfa,#9bbbd2);border-radius:12px;display:grid;place-items:center;color:#fff;font-size:32px}.hours{line-height:2;font-size:13px}.open{color:#10a85b;font-weight:900}.map{display:block;background:#eef7ff;border-radius:13px;padding:11px;color:#087ee3;font-weight:900;text-align:center;margin-top:10px}.feature{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.feature div{background:#f6faff;border:1px solid #e3edf5;border-radius:14px;padding:14px;text-align:center}.feature b{display:block;margin-bottom:5px;color:#07345c}
@media(max-width:700px){.top{padding:0 15px}.page{margin:12px;border-radius:18px}.cover{height:245px}.coverText{right:18px;bottom:18px}.coverText h2{font-size:24px}.profile{padding:0 18px 20px}.grid{grid-template-columns:1fr;padding:0 18px 20px}.name{font-size:24px}.gallery{grid-template-columns:1fr 1fr}.gallery img,.placeholder{height:95px}.feature{grid-template-columns:1fr}.actions a,.actions button{flex:1;text-align:center}.brand{font-size:20px}}
</style></head><body><header class="top"><a href="index.html" class="brand">دليل <b>سلمية</b></a><a href="index.html" class="btn">← رجوع للدليل</a></header><main class="page" id="page"></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>
const {createClient}=supabase;const sb=createClient(SUPABASE_CONFIG.url,SUPABASE_CONFIG.publishableKey);const id=new URLSearchParams(location.search).get('id');
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function fmtHours(h){if(!h)return 'غير محدد';if(typeof h==='string')return h;let f=v=>v?new Date('1970-01-01T'+v).toLocaleTimeString('ar-SY',{hour:'numeric',minute:'2-digit'}):'';let a=(h.morningOpen&&h.morningClose)?`صباحاً ${f(h.morningOpen)} - ${f(h.morningClose)}`:'';let b=(h.eveningOpen&&h.eveningClose)?`مساءً ${f(h.eveningOpen)} - ${f(h.eveningClose)}`:'';return [a,b].filter(Boolean).join(' | ')||'غير محدد'}
async function load(){const r=await sb.from('directory_shops').select('*').eq('id',id).maybeSingle();if(r.error)throw r.error;let x=r.data;if(!x){page.innerHTML='<div style="padding:40px;text-align:center">المحل غير موجود.</div>';return}let cat=x.category||'أخرى',logo=x.logo_data||'',cover=x.cover_data||'',gallery=x.gallery||[],services=x.services||[],offers=x.offers||[],wa='https://wa.me/'+((x.whatsapp||x.phone||'').replace(/^0/,'963'));page.innerHTML=`<div class="cover" style="background:${esc(x.theme||'#124c74')}">${cover?`<img src="${esc(cover)}">`:''}<div class="shade"></div><div class="coverText"><div class="mini">دليل سلمية • ${esc(cat)}</div><h2>${esc(x.name)}</h2></div></div><section class="profile"><div class="logo">${logo?`<img src="${esc(logo)}">`:esc((x.name||'م').charAt(0))}</div><h1 class="name">${esc(x.name)}</h1><span class="badge">${esc(cat)}</span><p class="slogan">${esc(x.slogan||'محلك أقرب لزبائنك')}</p><p class="meta">📍 ${esc(x.address||'')}　 ★ ${x.rating||'4.8'} (${x.reviews||'0'})</p><div class="actions"><a href="tel:${esc(x.phone||'')}">📞 اتصال</a><a class="wa" href="${wa}" target="_blank">💬 واتساب</a><a href="#services">الخدمات</a><a href="#gallery">الصور</a><button onclick="sharePage()">↗ مشاركة</button></div></section><div class="grid"><section class="box" id="services"><h2>خدمات المحل</h2><p>${esc(x.description||'خدمات ومنتجات مميزة')}</p><div class="services">${services.map(v=>`<span class="pill">${esc(v)}</span>`).join('')}</div><h2 style="margin-top:25px">العروض</h2>${offers.length?offers.map(v=>`<div class="offer">🔥 ${esc(v)}</div>`).join(''):'<div class="offer">لا توجد عروض حالياً</div>'}</section><section class="box"><h2>معلومات المحل</h2><p>📍 ${esc(x.address||'سلمية')}</p><p>☎ ${esc(x.phone||'')}</p><h2 style="margin-top:20px">أوقات الدوام</h2><div class="hours">${esc(fmtHours(x.hours))}<br><span class="open">● الدوام حسب الأوقات المحددة</span></div>${x.maps_url?`<a class="map" href="${esc(x.maps_url)}" target="_blank">📍 فتح الموقع على الخريطة</a>`:''}</section><section class="box" id="gallery" style="grid-column:1/-1"><h2>صور المحل</h2><div class="gallery">${gallery.length?gallery.map(g=>`<img src="${esc(g)}">`).join(''):'<div class="placeholder">📷 لا توجد صور بعد</div>'}</div></section></div>`}
function sharePage(){if(navigator.share)navigator.share({title:document.title,url:location.href});else alert('انسخ رابط الصفحة وشاركه')}
load().catch(e=>{console.error(e);page.innerHTML='<div style="padding:40px;text-align:center">تعذر تحميل بيانات المحل من قاعدة البيانات.</div>'});
</script></body></html>
