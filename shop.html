<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>صفحة المحل</title><style>body{margin:0;background:#090909;color:#fff;font-family:Arial}.wrap{max-width:950px;margin:auto;padding:15px}.back,.btn{display:inline-block;padding:11px 16px;border-radius:12px;background:#222;color:#fff;text-decoration:none;margin-bottom:15px}.btn{background:#e21b23;margin:4px}.cover{height:300px;background:#151515;border-radius:25px;overflow:hidden}.cover img{width:100%;height:100%;object-fit:cover}.head{display:flex;gap:15px;align-items:center;margin-top:-45px;padding:0 20px;position:relative}.logo{width:105px;height:105px;object-fit:cover;border-radius:22px;border:4px solid #090909;background:#222}.name{background:#111e;padding:15px;border-radius:18px;flex:1}.name h1{margin:4px 0;font-size:32px}.card{background:#151515;border:1px solid #292929;border-radius:20px;padding:20px;margin-top:15px}.muted{color:#aaa;line-height:1.8}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.gallery img{width:100%;height:180px;object-fit:cover;border-radius:14px}.pill{background:#35090b;color:#ff7076;border-radius:20px;padding:5px 10px}@media(max-width:700px){.head{padding:0 5px}.name h1{font-size:24px}.gallery{grid-template-columns:1fr 1fr}}</style><div class="wrap"><a class="back" href="index.html">← العودة للدليل</a><div id="app"></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://fwusmydbkxuxdhocwsxk.supabase.co','sb_publishable_O53L9s6fbvwn_BZ8DEVKCA_e7C9kgoF'),id=new URLSearchParams(location.search).get('id');function esc(x=''){return String(x).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}async function load(){try{let r=await sb.from('salamiyah_data').select('value').eq('id','salamiyah_shops').maybeSingle();if(r.data)localStorage.setItem('salamiyah_shops',JSON.stringify(r.data.value))}catch(e){}}function render(){let a=[];try{a=JSON.parse(localStorage.getItem('salamiyah_shops')||'[]')}catch{}let x=a.find(v=>String(v.id)===String(id));if(!x){app.innerHTML='<div class="card"><h2>المحل غير موجود</h2></div>';return}document.title=x.name+' — دليل سلمية';let phone=(x.phone||'').replace(/\s/g,''),wa=(x.whatsapp||phone).replace(/\D/g,'');app.innerHTML=`<div class="cover">${x.cover?`<img src="${esc(x.cover)}">`:''}</div><div class="head">${x.logo?`<img class="logo" src="${esc(x.logo)}">`:''}<div class="name"><span class="pill">${esc(x.cat||'أخرى')}</span><h1>${esc(x.name)}</h1><div class="muted">${esc(x.slogan||'')}</div></div></div><div class="card"><h2>عن المحل</h2><p class="muted">${esc(x.desc||'')}</p><a class="btn" href="tel:${esc(phone)}">اتصال</a>${wa?`<a class="btn" target="_blank" href="https://wa.me/${wa}">واتساب</a>`:''}${x.maps?`<a class="btn" target="_blank" href="${esc(x.maps)}">الخريطة</a>`:''}</div>${x.services?.length?`<div class="card"><h2>الخدمات</h2><p class="muted">${x.services.map(esc).join(' • ')}</p></div>`:''}${x.offers?.length?`<div class="card"><h2>العروض</h2><p class="muted">${x.offers.map(esc).join(' • ')}</p></div>`:''}${x.gallery?.length?`<div class="card"><h2>الصور</h2><div class="gallery">${x.gallery.map(v=>`<img src="${esc(v)}">`).join('')}</div></div>`:''}<div class="card"><h2>العنوان</h2><p class="muted">${esc(x.address||'')}</p></div>`}load().then(render)</script></html>
